
<style>
*{margin:0;padding:0;box-sizing:border-box}
.wrap{min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:2rem 1rem;position:relative;overflow:hidden;background:#0a0a1a;border-radius:16px}
.bg-orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:0.35;animation:float 6s ease-in-out infinite}
.orb1{width:260px;height:260px;background:#6c63ff;top:-60px;left:-60px;animation-delay:0s}
.orb2{width:200px;height:200px;background:#00d4aa;bottom:-40px;right:-40px;animation-delay:2s}
.orb3{width:150px;height:150px;background:#ff6b9d;top:40%;left:50%;animation-delay:4s}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-20px) scale(1.05)}}
.company{font-size:13px;letter-spacing:0.25em;text-transform:uppercase;font-weight:500;background:linear-gradient(90deg,#6c63ff,#00d4aa,#ff6b9d,#6c63ff);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 3s linear infinite;margin-bottom:1.2rem}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.day-date{display:flex;gap:1.2rem;align-items:center;margin-bottom:1rem}
.day{font-size:14px;color:#a0a0c0;letter-spacing:0.1em}
.dot-sep{width:4px;height:4px;border-radius:50%;background:#6c63ff;opacity:0.7}
.date{font-size:14px;color:#a0a0c0;letter-spacing:0.05em}
.clock-row{display:flex;align-items:center;gap:0.1em;margin-bottom:1.2rem}
.digit-block{display:flex;flex-direction:column;align-items:center}
.digit{font-family:monospace;font-size:clamp(52px,14vw,88px);font-weight:700;line-height:1;transition:color 0.3s}
.hh{color:#a78bfa}
.mm{color:#34d399}
.ss{color:#f472b6}
.colon{font-family:monospace;font-size:clamp(40px,10vw,70px);font-weight:300;color:#ffffff30;margin:0 2px;animation:blink 1s step-start infinite;line-height:1;padding-bottom:4px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.15}}
.label{font-size:10px;letter-spacing:0.15em;text-transform:uppercase;margin-top:2px}
.lh{color:#a78bfa99}
.lm{color:#34d39999}
.ls{color:#f472b699}
.progress-bar{width:min(320px,85vw);height:3px;background:#ffffff10;border-radius:2px;overflow:hidden;margin-top:0.5rem}
.progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#6c63ff,#00d4aa);transition:width 0.95s linear}
</style>

<div class="wrap">
  <div class="orb1 bg-orb"></div>
  <div class="orb2 bg-orb"></div>
  <div class="orb3 bg-orb"></div>

  <div class="company">Mohamed  Elsisi</div>

  <div class="day-date">
    <span class="day" id="day">—</span>
    <div class="dot-sep"></div>
    <span class="date" id="date">—</span>
  </div>

  <div class="clock-row">
    <div class="digit-block">
      <span class="digit hh" id="hh">00</span>
      <span class="label lh">ساعة</span>
    </div>
    <span class="colon">:</span>
    <div class="digit-block">
      <span class="digit mm" id="mm">00</span>
      <span class="label lm">دقيقة</span>
    </div>
    <span class="colon">:</span>
    <div class="digit-block">
      <span class="digit ss" id="ss">00</span>
      <span class="label ls">ثانية</span>
    </div>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="prog" style="width:0%"></div>
  </div>
</div>

<script>
const days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function pad(v){return String(v).padStart(2,'0')}
function tick(){
  const n=new Date();
  document.getElementById('hh').textContent=pad(n.getHours());
  document.getElementById('mm').textContent=pad(n.getMinutes());
  document.getElementById('ss').textContent=pad(n.getSeconds());
  document.getElementById('date').textContent=`${n.getDate()} ${months[n.getMonth()]} ${n.getFullYear()}`;
  document.getElementById('day').textContent=days[n.getDay()];
  const pct=(n.getSeconds()/59)*100;
  document.getElementById('prog').style.width=pct+'%';
}
tick();
setInterval(tick,1000);
</script>
